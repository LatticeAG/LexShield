rules: ../../../packs/baseline-deny/rules.yaml
policy:
  version: 1
  id: alternatives-intent-match
  name: Alternative intent match
  defaultVerdict: BLOCK
  rules:
  - id: block-exfil-alt
    name: Block exfil via alternative intent
