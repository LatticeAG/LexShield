rules: ../../../packs/pii-guard/rules.yaml
policy:
  version: 1
  id: pii-guard-slack
  name: PII guard with Slack challenge
  defaultVerdict: BLOCK
  rules:
    - id: allow-health
      priority: 100
      match:
        tools: ["health_check", "ping"]
        intents: ["network.request.health"]
      verdict: ALLOW
      reason: "Health checks are always allowed"
    - id: challenge-pii-slack
      priority: 220
      match:
        intents: ["comms.send.slack"]
        tags:
          data_class: ["pii"]
      verdict: CHALLENGE
      reason: "Sending PII via Slack requires approval"
      challenge:
        channel: stdout
        timeoutSeconds: 3600
        onTimeout: BLOCK
    - id: challenge-pii-email
      priority: 220
      match:
        intents: ["comms.send.email", "comms.send.external"]
        tags:
          data_class: ["pii"]
      verdict: CHALLENGE
      reason: "Sending PII requires approval"
      challenge:
        channel: stdout
        timeoutSeconds: 3600
        onTimeout: BLOCK
    - id: block-http-non-allowlist
      priority: 250
      match:
        intents: ["network.request.http"]
        expression: '!(args.url startsWith "https://api.mycompany.com/")'
      verdict: BLOCK
      reason: "HTTP to non-allowlisted host"
    - id: block-secret-exposure
      priority: 300
      match:
        intents: ["security.secret_exposure"]
      verdict: BLOCK
      reason: "Possible secret exposure in tool arguments"
    - id: block-exfil
      priority: 300
      match:
        intents: ["data.exfiltrate"]
      verdict: BLOCK
      reason: "Possible data exfiltration"
