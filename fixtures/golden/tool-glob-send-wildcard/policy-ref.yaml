rules: ../../../packs/baseline-deny/rules.yaml
policy:
  version: 1
  id: tool-glob-send-wildcard
  name: Glob tool send wildcard fixture
  defaultVerdict: BLOCK
  rules:
  - id: allow-send-tools
    name: Allow send_* tools
    priority: 100
    match:
      tools:
      - send_*
      intents:
      - comms.send.slack
      - comms.send.email
    verdict: ALLOW
    reason: Send tools are allowed
